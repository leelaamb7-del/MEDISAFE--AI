<!DOCTYPE html>
<html>
<head>
<title>MediSafe AI+</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<!-- 📊 CHART LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial;
    background: #f5f7fa;
    padding: 20px;
}

h1 { text-align: center; }

.card {
    background: white;
    padding: 15px;
    border-radius: 15px;
    margin: 10px;
    box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
}

button {
    padding: 10px;
    border: none;
    background: #4CAF50;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

input, select {
    padding: 8px;
    margin: 5px;
}
</style>
</head>

<body>

<h1>💊 MediSafe AI+</h1>

<h3>🌐 Language</h3>
<select id="lang">
    <option value="en">English</option>
    <option value="ta">Tamil</option>
    <option value="hi">Hindi</option>
</select>

<!-- ================= MEDICINE ================= -->
<h3>Add Medicine</h3>

<input id="name" placeholder="Medicine Name">
<input id="stock" placeholder="Stock (e.g. 10)">
<input id="dose" placeholder="Dose per use (e.g. 1)">
<input id="threshold" placeholder="Low stock alert (e.g. 3)">

<select id="type">
    <option>Pill 💊</option>
    <option>Syrup 🧴</option>
    <option>Injection 💉</option>
</select>

<select id="priority">
    <option value="normal">Normal</option>
    <option value="critical">Critical ⚠️</option>
</select>

<button onclick="addMedicine()">Add</button>

<!-- ================= OCR ================= -->
<h3>📷 Prescription Scanner</h3>
<input type="file" id="imageInput">
<button onclick="scanPrescription()">Scan</button>
<p id="ocrResult"></p>

<!-- ================= SYMPTOM TRACKER (NEW) ================= -->
<h3>📊 Symptom Tracker</h3>

<input id="symptomInput" placeholder="Enter symptom (fever, headache...)">
<button onclick="logSymptom()">Log Symptom</button>
<button onclick="showGraph()">Show Trend</button>

<canvas id="symptomChart" width="400" height="200"></canvas>

<!-- ================= LIST ================= -->
<h3>Medicine List</h3>
<div id="list"></div>

<h3>Interaction</h3>
<button onclick="checkInteraction()">Check</button>
<p id="interaction"></p>

<h3>Reminder</h3>
<button onclick="startReminder()">Start Reminder</button>

<h3>Report</h3>
<button onclick="showReport()">View Report</button>
<p id="report"></p>

<h3>Advice</h3>
<input id="symptom" placeholder="Enter symptom">
<button onclick="getAdvice()">Get Advice</button>
<p id="advice"></p>

<script>

// ================= DATA =================
let medicines = JSON.parse(localStorage.getItem("meds")) || [];
let symptoms = JSON.parse(localStorage.getItem("symptoms")) || [];
let chart;

// ================= SYMPTOM SCORE SYSTEM =================
function symptomScore(symptom) {
    symptom = symptom.toLowerCase();

    if (symptom.includes("fever")) return 8;
    if (symptom.includes("headache")) return 6;
    if (symptom.includes("cough")) return 5;
    if (symptom.includes("cold")) return 4;
    if (symptom.includes("good")) return 2;

    return 3;
}

// ================= LOG SYMPTOM =================
function logSymptom() {
    let s = document.getElementById("symptomInput").value;
    if (!s) return;

    let entry = {
        text: s,
        score: symptomScore(s),
        date: new Date().toLocaleDateString()
    };

    symptoms.push(entry);
    localStorage.setItem("symptoms", JSON.stringify(symptoms));

    alert("Symptom saved!");
}

// ================= GRAPH =================
function showGraph() {
    let ctx = document.getElementById("symptomChart").getContext("2d");

    let labels = symptoms.map(s => s.date);
    let data = symptoms.map(s => s.score);

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels: labels,
            datasets: [{
                label: "Symptom Trend",
                data: data,
                borderColor: "blue",
                fill: false
            }]
        }
    });
}

// ================= OCR =================
function scanPrescription() {
    let file = document.getElementById("imageInput").files[0];

    if (!file) return alert("Upload image");

    Tesseract.recognize(file, 'eng').then(({ data: { text } }) => {
        let meds = ["paracetamol", "ibuprofen", "amoxicillin", "aspirin"];

        let found = "Unknown Medicine";

        for (let m of meds) {
            if (text.toLowerCase().includes(m)) {
                found = m;
            }
        }

        document.getElementById("name").value = found;
        document.getElementById("ocrResult").innerText = "Detected: " + found;
    });
}

// ================= MEDICINE =================
function addMedicine() {
    let name = document.getElementById("name").value;
    let stock = parseInt(document.getElementById("stock").value);
    let dose = parseInt(document.getElementById("dose").value);
    let threshold = parseInt(document.getElementById("threshold").value);
    let type = document.getElementById("type").value;
    let priority = document.getElementById("priority").value;

    medicines.push({ name, stock, dose, threshold, type, priority });

    localStorage.setItem("meds", JSON.stringify(medicines));
    display();
}

function takeMedicine(i) {
    medicines[i].stock -= medicines[i].dose;

    if (medicines[i].stock <= medicines[i].threshold) {
        alert("⚠️ Low stock");
    }

    localStorage.setItem("meds", JSON.stringify(medicines));
    display();
}

function display() {
    let list = document.getElementById("list");
    list.innerHTML = "";

    medicines.forEach((m, i) => {
        list.innerHTML += `
        <div class="card">
            <b>${m.name}</b><br>
            Stock: ${m.stock}<br>
            <button onclick="takeMedicine(${i})">Taken</button>
        </div>`;
    });
}

// ================= INTERACTION =================
function checkInteraction() {
    let msg = "Safe";
    document.getElementById("interaction").innerText = msg;
}

// ================= REMINDER =================
function startReminder() {
    alert("Reminder started!");
}

// ================= REPORT =================
function showReport() {
    document.getElementById("report").innerText =
        "Total Medicines: " + medicines.length;
}

// ================= ADVICE =================
function getAdvice() {
    let s = document.getElementById("symptom").value;

    let msg = "Consult doctor";
    if (s.includes("fever")) msg = "Take paracetamol";
    if (s.includes("cough")) msg = "Use syrup";

    document.getElementById("advice").innerText = msg;
}

// INIT
display();

</script>

</body>
</html>
